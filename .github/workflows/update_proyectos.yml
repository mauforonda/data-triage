name: Update proyectos data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-proyectos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: produccion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Update proyectos dataset
        run: python proyectos/update.py

      - name: Commit changes
        run: |
          if git diff --quiet -- proyectos/proyectos.csv; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyectos/proyectos.csv
          git commit -m "Update proyectos data"
          git push
