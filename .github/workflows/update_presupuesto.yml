name: Update presupuesto data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-presupuesto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/fuentes/extra/economia
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: data/fuentes/extra/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Update presupuesto datasets
        run: python presupuesto/update.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/fuentes/extra/economia/presupuesto/data; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuentes/extra/economia/presupuesto/data
          git commit -m "Update presupuesto data"
          git push
